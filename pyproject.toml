[project]
name = "sharedauth"
version = "0.1.0"
description = "Rotinas de login e mensagens compartilhadas entre os apps Flask do mantenedor"
requires-python = ">=3.13"
dependencies = [
    # Faixas alinhadas às já em produção no MegaSena e no ControleRendaVariavel
    # -- ver AGENTS.md dos quatro projetos: alargar o teto, manter o piso.
    "Flask>=3.1.3,<4",
    "Flask-WTF>=1.2.2,<2",
    "Flask-Limiter>=3.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sharedauth*"]

[tool.setuptools.package-data]
sharedauth = ["messages/templates/sharedauth/*.html", "messages/static/*.css"]
