name: CI

# Dependências, lint e testes rodam no contêiner do repositório; o runner só
# fornece Docker para construir e executar os serviços.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Docker Python 3.15
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validar Compose
        run: docker compose --profile quality config --quiet
      - name: Construir a imagem quality atualizada
        run: docker compose --profile quality build --pull --no-cache quality
      - name: Ruff e testes no contêiner
        run: docker compose --profile quality run --rm --no-deps quality
      - name: Auditar dependências instaladas
        run: docker compose --profile quality run --rm --no-deps audit
      - name: Varredura HIGH/CRITICAL da imagem quality
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          chmod 777 "$RUNNER_TEMP/trivy-cache"
          docker save sharedauth-quality:local -o "$RUNNER_TEMP/quality.tar"
          chmod 644 "$RUNNER_TEMP/quality.tar"
          docker compose -f .github/docker-compose.yml run --rm trivy \
            --cache-dir /tmp/trivy-cache \
            image --input /varredura/quality.tar \
                  --scanners vuln \
                  --severity HIGH,CRITICAL \
                  --ignore-unfixed \
                  --exit-code 1 \
                  --format table
