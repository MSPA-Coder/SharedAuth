name: CI

# Este workflow era o menos endurecido dos seis: `actions/checkout@v4` e
# `ubuntu-latest`, sem `permissions` e sem `concurrency`, enquanto os quatro
# aplicativos já fixavam action por SHA e versão de runner.
#
# A inversão importa: uma tag de action é um ponteiro móvel, e quem controla o
# repositório da action pode reapontá-la. Fixar por SHA é o que torna a
# execução reproduzível. Deixar isso de fora justamente na única dependência
# compartilhada pelos quatro aplicativos era proteger as folhas e não a raiz.
#
# Os SHAs abaixo não foram procurados avulsos: são exatamente os que o
# `BackupRestore` já usa, para os seis convergirem em vez de cada um fixar uma
# versão diferente da mesma action.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

      # O Dependabot abre PR quando sai versão nova. Isso não é a mesma
      # pergunta que "a versão que está instalada AGORA tem CVE conhecido?" --
      # e essa segunda ninguém fazia em nenhum dos seis repositórios.
      #
      # Reprova em qualquer achado, de propósito. Vulnerabilidade sem correção
      # publicada sai por `--ignore-vuln <ID>` com um comentário dizendo por
      # quê: assim cada exceção vira uma decisão explícita e datada, em vez de
      # um vermelho permanente que se aprende a ignorar.
      - name: Auditar dependências instaladas (CVE conhecido)
        run: pip-audit --progress-spinner=off
