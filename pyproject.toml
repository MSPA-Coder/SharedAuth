[project]
name = "sharedauth"
version = "0.13.0"
description = "Contratos compartilhados de autenticação, segurança, formatação e interface"
# Piso elevado a 3.14 em 07/09/2026 (achado L03 do LEVANTAMENTO_2026-09.md).
# A politica da casa e alargar o teto e preservar o piso, e ela continua
# valendo -- o motivo aqui e outro: o piso declarava uma compatibilidade que
# NINGUEM verificava. Todas as imagens rodam `python:3.14-slim` e nenhum job
# jamais executou a suite em 3.12 ou 3.13. Declarar 3.14 e dizer a verdade
# sobre o unico ambiente exercitado; voltar atras exige uma matriz na CI que
# realmente rode nas versoes menores.
requires-python = ">=3.14"
# O núcleo permanece sem dependências para que `security`, `formatting` e `ui`
# sejam importáveis sem carregar um framework web. Integrações Flask usam o extra.
dependencies = []

[project.optional-dependencies]
flask = [
    # Faixas compatíveis com o contrato público; o teto evita majors incompatíveis.
    "Flask>=3.1.3,<4",
    "Flask-WTF>=1.2.2,<2",
    "Flask-Limiter>=3.0,<5",
    # Já vem como dependência do Flask; declarado porque `passwords` importa
    # `werkzeug.security` diretamente e não deve depender de um transitivo.
    "Werkzeug>=3.1,<4",
]
dev = [
    "sharedauth[flask]",
    "pytest>=8.3,<10",
    # Lint na CI, como nos repositorios irmaos. Faltava aqui: um import
    # duplicado e mal indentado em `tests/test_access.py` passou meses sem
    # ninguem ver.
    "ruff>=0.12,<1",
    # Auditoria de CVE das dependências instaladas. Piso na minor atual, teto
    # na próxima major — política de faixa do mantenedor.
    "pip-audit>=2.10,<3",
]

[tool.pytest.ini_options]
markers = [
  # Le JS ou CSS porque nenhum teste executa o navegador; confere so o que
  # define o mecanismo (docs/TESTES.md, T6).
  "sentinela_front: guarda textual de um mecanismo de front-end critico",
]
filterwarnings = [
  # A suite do limiter usa o armazenamento em memoria de proposito: cada teste
  # monta o seu app. O aviso do Flask-Limiter serve a producao, onde os
  # consumidores passam `storage_uri`; aqui ele so esconde avisos que importam.
  "ignore:Using the in-memory storage for tracking rate limits:UserWarning",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Layout `src/`: o pacote nao fica na raiz do repositorio, entao o diretorio
# de trabalho nunca o coloca em `sys.path` por acidente. Consequencia
# pratica: `pytest` so encontra `sharedauth` porque ele esta instalado, e
# portanto exercita exatamente o que os aplicativos consumidores recebem --
# inclusive os arquivos de `package-data` abaixo, que com o layout plano
# eram lidos do repositorio mesmo quando ficavam de fora do wheel.
[tool.setuptools.packages.find]
where = ["src"]
include = ["sharedauth*"]

[tool.setuptools.package-data]
sharedauth = [
  "messages/templates/sharedauth/*.html",
  "messages/static/*.css",
  # O CSS e o JS de `ui/` sao o produto do pacote, nao acessorio: sem
  # eles a instalacao traz um modulo Python que nao serve para nada.
  "ui/estatico/*.css",
  "ui/estatico/*.js",
]

# Regras fixadas, como nos repositorios irmaos: sem `select`, cada versao nova
# do Ruff muda o que e conferido (a 0.16 passou a ligar regras que a 0.15 nao
# ligava), e a CI ficaria vermelha ou verde por causa da versao, nao do codigo.
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
]
